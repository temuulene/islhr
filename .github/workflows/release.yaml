# Builds installable copies of the package on every tag and attaches them to
# the release.
#
# Staff who cannot reach GitHub from R install from these instead: download the
# .zip and run install.packages("path/to/islhr_x.y.z.zip", repos = NULL).

# Tag-driven only. A manual run has no tag to attach assets to, so the
# release step would have nowhere to put them.
on:
  push:
    tags: ['v*']

name: release

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, artifact: zip}
          - {os: ubuntu-latest,  artifact: tar.gz}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with DESCRIPTION produces a release whose assets
      # are named for a different version than the tag says. Catch it here
      # rather than after staff have downloaded it.
      - name: Check the tag matches DESCRIPTION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          described=$(grep '^Version:' DESCRIPTION | sed 's/Version: *//')
          if [ "$tag" != "$described" ]; then
            echo "Tag v$tag does not match DESCRIPTION version $described." >&2
            exit 1
          fi
          echo "Tag and DESCRIPTION agree on $described."
        shell: bash

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.artifact == 'zip' && '4.4.1' || 'release' }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Require a clean package check
        run: rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "note")
        shell: Rscript {0}

      - name: Build source package
        if: matrix.config.artifact == 'tar.gz'
        run: R CMD build .

      # A Windows binary is what a locked-down laptop can install without a
      # compiler and without reaching CRAN.
      - name: Build Windows binary
        if: matrix.config.artifact == 'zip'
        run: |
          R CMD INSTALL --build .
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.config.artifact }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
          fail_on_unmatched_files: true
