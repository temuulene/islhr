url: https://temuulene.github.io/islhr/

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, articles, news]
  components:
    articles:
      text: Articles
      menu:
        - text: Writing reports
          href: articles/reports.html
        - text: Mapping health geographies
          href: articles/maps.html
        - text: Moving from the theme script
          href: articles/migrating.html

reference:
  - title: Setting up
    desc: >
      Run `islh_setup()` once at the top of a report. It works out whether you
      are rendering to HTML or Word and configures plots and tables to match.
    contents:
      - islh_setup
      - islh_check
      - islh_install_deps
      - islh_help
      - islh_version

  - title: Starting a report
    desc: Scaffold a project, or add the Island Health format to one you have.
    contents:
      - islh_create_report
      - islh_use_quarto
      - islh_use_brand

  - title: Figures
    desc: The theme and the colour scales.
    contents:
      - theme_islh
      - starts_with("scale_colour_islh")
      - starts_with("scale_fill_islh")
      - scale_y_islh_count
      - islh_save_plot
      - islh_example_plot

  - title: Maps
    desc: Choropleths of Island Health geographies.
    contents:
      - theme_islh_map
      - coord_islh_map
      - islh_caption

  - title: Colours and assets
    contents:
      - islh_brand
      - islh_hex
      - islh_font_family
      - islh_logo
      - islh_brand_yml
      - islh_reference_docx
      - islh_example_data

  - title: Tables
    contents:
      - islh_gt
      - islh_flextable
      - islh_gtsummary_gt
      - islh_gtsummary_flex
